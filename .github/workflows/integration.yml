name: Compatibility

on:
  workflow_call:
    inputs:
      library_ref:
        required: true
        type: string
      sanity_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-compatibility:
    name: With .NET ${{ matrix.dotnet-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Check compatibility across recent supported .NET versions
        dotnet-version: [ '8.0.x', '9.0.x', '10.0.x' ]
      fail-fast: false

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.library_ref }}
          path: project/library

      - name: Checkout sanity stub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sanity_ref }}
          path: project/sanity

      - name: Setup .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cb85 # v4.3.0
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          cache: true

      - name: Build Library
        working-directory: project/library
        run: dotnet build --configuration Release

      - name: Check Installability
        working-directory: project/sanity
        run: dotnet test --configuration Release
