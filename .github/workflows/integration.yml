name: Compatibility

on:
  workflow_call:
    inputs:
      library_ref:
        required: true
        type: string
      sanity_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-compatibility:
    name: With .NET ${{ matrix.dotnet-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Check compatibility across the frameworks the library ships
        # (lib/net9.0 and lib/net10.0). net8.0 is intentionally excluded:
        # the generated models use System.Text.Json's JsonStringEnumMemberName,
        # which only exists on .NET 9 and later.
        dotnet-version: [ '9.0.x', '10.0.x' ]
      fail-fast: false

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.library_ref }}
          path: project/library

      - name: Checkout sanity stub
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sanity_ref }}
          path: project/sanity

      - name: Setup .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          # Always install the .NET 10 SDK alongside the matrix row's SDK:
          # packing a net9.0;net10.0 library requires the newest SDK, while the
          # row's SDK is what builds the matching sanity TFM.
          dotnet-version: |
            ${{ matrix.dotnet-version }}
            10.0.x

      - name: Build Library
        # Pack the SDK into a local feed so the sanity project can consume it
        # as a real NuGet package instead of via a project reference.
        working-directory: project/library
        run: dotnet pack --configuration Release --output "$GITHUB_WORKSPACE/localfeed"

      - name: Check Installability
        # The sanity project's nuget.config points at ../../localfeed, which
        # resolves to $GITHUB_WORKSPACE/localfeed from project/sanity. Restore
        # then test against the freshly packed package.
        working-directory: project/sanity
        run: |
          dotnet restore
          dotnet test --configuration Release --no-restore
